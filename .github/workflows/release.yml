name: Build & release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: Swatinem/rust-cache@v2

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -TargetDir "${{ github.workspace }}/target"

      - uses: actions/upload-artifact@v4
        with:
          name: Stellar-win-x64
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $zip.FullName --title "Stellar ${{ github.ref_name }}" --generate-notes
